apiVersion: v2
name: openg2p-agents-registry
description: |
  OpenG2P Agents Registry — a reference registry of the agents who serve
  farmers (extension agents, development agents, animal health workers): their
  employment, assignments, specializations, qualifications and trainings.

  A thin package over the shared openg2p-registry chart: this chart owns no
  templates, only a values overlay (variant identity, hostname, the agents
  images, the Agent ID pool, seed toggles). Every deployment, service, gateway,
  keycloak/iam wiring and the db-seed machinery come from the openg2p-registry
  subchart.
type: application

# Static placeholder; CI derives the published version from git.
version: 0.0.0-develop
appVersion: "develop"

keywords:
  - openg2p
  - registry
  - agents-registry
  - activity-register
home: https://openg2p.org
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
sources:
  - https://github.com/OpenG2P/agents-registry
maintainers:
  - name: OpenG2P
    email: info@openg2p.org

# Keep this in lockstep with RP_VERSION in docker/*/Dockerfile:
#     ./scripts/bump-rp-version.sh <version>
dependencies:
  - name: openg2p-registry
    alias: registry
    version: 0.0.0-develop.856
    repository: https://openg2p.github.io/openg2p-helm

annotations:
  catalog.cattle.io/display-name: "OpenG2P Agents Registry"
  catalog.cattle.io/certified: partner
  catalog.cattle.io/kube-version: ">=1.23.0-0"
  openg2p.org/add-to-rancher: ""
