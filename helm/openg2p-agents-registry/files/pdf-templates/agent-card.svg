<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380">
  <!--
    Agents Registry credential card: the agent's ID card.

    A real design file, not markup in code: a designer edits it here and the
    chart ships it as a ConfigMap. The Agent Portal API mounts it, substitutes the
    {{...}} placeholders at render time and converts SVG -> PDF.

    Placeholders:
      {{title}}              card title            (chart: agentPortalApi.pdf.title)
      {{issuerName}}         issuing authority     (chart: agentPortalApi.pdf.issuerName)
      {{qr}}                 signed QR, data-URI   (generated)
      {{fullName}}           )
      {{functionalRecordId}} )
      {{dateOfBirth}}        )  claims, from agent_vc_view
      {{gender}}             )
      {{position}}           )
      {{servicePoint}}       )
      {{assignedArea}}       )
      {{photo}}              empty in Phase 1 (the photograph is deferred), so
                             the frame stays blank rather than the layout moving.
  -->
  <rect width="600" height="380" fill="#ffffff" stroke="#1f5f8b" stroke-width="4"/>
  <rect x="0" y="0" width="600" height="56" fill="#1f5f8b"/>
  <text x="24" y="36" font-family="Helvetica" font-size="22" font-weight="bold" fill="#ffffff">{{title}}</text>
  <text x="24" y="78" font-family="Helvetica" font-size="12" fill="#555555">Issued by {{issuerName}}</text>

  <rect x="430" y="92" width="146" height="168" fill="#f2f2f2" stroke="#cccccc" stroke-width="1"/>
  <image x="430" y="92" width="146" height="168" href="{{photo}}" preserveAspectRatio="xMidYMid slice"/>

  <text x="24" y="110" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1f5f8b">FULL NAME</text>
  <text x="24" y="128" font-family="Helvetica" font-size="14">{{fullName}}</text>
  <text x="24" y="154" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1f5f8b">AGENT ID</text>
  <text x="24" y="172" font-family="Helvetica" font-size="14">{{functionalRecordId}}</text>
  <text x="200" y="154" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1f5f8b">POSITION</text>
  <text x="200" y="172" font-family="Helvetica" font-size="14">{{position}}</text>
  <text x="24" y="198" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1f5f8b">SERVICE POINT</text>
  <text x="24" y="216" font-family="Helvetica" font-size="13">{{servicePoint}}</text>
  <text x="24" y="242" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1f5f8b">ASSIGNED AREA</text>
  <text x="24" y="260" font-family="Helvetica" font-size="13">{{assignedArea}}</text>
  <text x="200" y="242" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1f5f8b">DATE OF BIRTH</text>
  <text x="200" y="260" font-family="Helvetica" font-size="13">{{dateOfBirth}}</text>
  <text x="330" y="242" font-family="Helvetica" font-size="12" font-weight="bold" fill="#1f5f8b">GENDER</text>
  <text x="330" y="260" font-family="Helvetica" font-size="13">{{gender}}</text>

  <image x="24" y="268" width="104" height="104" href="{{qr}}"/>
  <text x="140" y="372" font-family="Helvetica" font-size="9" fill="#777777">Scan the QR to verify this credential offline.</text>
</svg>
