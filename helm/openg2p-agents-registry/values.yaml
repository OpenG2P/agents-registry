# Agents Registry — values overlay for the openg2p-registry chart.
#
#     helm repo add openg2p https://openg2p.github.io/openg2p-helm
#     helm dependency build ./helm/openg2p-agents-registry
#     helm -n <ns> install agents ./helm/openg2p-agents-registry
#
# global.* propagates to the subchart; registry.* configures the subchart itself.
# Everything not set here is inherited from openg2p-registry.

global:
  baseDomain: '{{ .Release.Namespace }}.openg2p.org'
  registryVariant: 'agents-registry'
  registryHostname: '{{ .Release.Name }}.{{ tpl .Values.global.baseDomain $ }}'

  # Not shared with partners: no bank, insurer or OAN service reads agents
  # through the Exchange. Every consent path is off: the Partner API asks no
  # Consent Manager, and there is no data scope catalogue to publish (the
  # registry has no data scopes). It still checks every partner's signature: it
  # is deployed only to take data in (a learning platform's trainings, an
  # existing agent system's records).
  consentEnforcementEnabled: false
  partnerDataScopesPublicGetEnabled: false
  partnerSignatureValidationEnabled: true

  # The Registry Connector (registry.registryConnector, off): the platform's
  # optional ingestion gateway (ODK Central, webhooks, event buses → the partner
  # API's ingest_data). Of use here only if an existing agent system pushes its
  # records that way. Its chart does not template these, so they are literal:
  # set the hostname, and the partner API's service (<release>-partner-api),
  # when turning it on.
  connectorHostname: ''
  partnerApiService: 'agents-partner-api'

  # Object store: the in-cluster commons Garage (S3-compatible).
  minioHost: 'commons-garage:3900'
  minioSecure: false

  postgresqlHost: commons-postgresql
  registryDB: '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  # No Master Data database settings: the registry reads Master Data through its
  # API (the subchart's global.masterDataReadMode 'api').

registry:
  # Agents images, each FROM the matching openg2p-registry base image. CI
  # rewrites these tags to the freshly built version.
  staffApi:
    image:
      repository: openg2p/openg2p-agents-registry-staff-api
      tag: 0.0.0-develop
  partnerApi:
    image:
      repository: openg2p/openg2p-agents-registry-partner-api
      tag: 0.0.0-develop
  celeryWorker:
    image:
      repository: openg2p/openg2p-agents-registry-celery
      tag: 0.0.0-develop
    # Helm merges maps, so these add to the subchart's worker env.
    envVars:
      # Sample trainings for the sample agents, recorded once through the
      # activity write path. Off by default; for a demo, turn it on together
      # with dbSeed.loadSampleData (the trainings need the sample agents).
      REGISTRY_CELERY_WORKERS_ACTIVITY_LOAD_SAMPLE_DATA: "false"
  celeryBeat:
    image:
      repository: openg2p/openg2p-agents-registry-celery
      tag: 0.0.0-develop
  dbSeed:
    image:
      repository: openg2p/openg2p-agents-registry-db-seed
      tag: 0.0.0-develop
    # Off by default. When on, loads the country pack's sample agents
    # (openg2p-data packs/<country>/samples/agents.json, the country Master Data
    # serves) as approved Agent records, with their specializations and
    # qualifications. Sample trainings come from the Celery sample task
    # (celeryWorker.envVars above).
    loadSampleData: false
    loadImages: false
    # No templates: this registry renders no records for partners; db-seed skips
    # the upload when the image ships none.
    # Code lists are NOT seeded or copied into this registry: the forms and the
    # activity checks read every AGENT_* list live from Master Data. They are the
    # country pack's agriculture domain, loaded by the master-data chart with
    # geoSeed.domains: [agriculture] — set there, not here.

  iamRegister:
    applicationDescription: "Agents Registry"
    # Rancher may skip Helm hooks, and a failing post-install hook fails the
    # whole release: run IAM registration as a regular Job (as FR and CSR do).
    runAsHook: false

  # Functional-ID pools, one per register that mints IDs: the Agent register
  # (pool = register mnemonic in lowercase; no prefix, so an Agent ID is eight
  # digits, e.g. 48207193). The list sections and AgentTraining need no pool.
  # Helm merges maps, so the subchart's default pools are inherited and
  # provisioned unused — harmless.
  idgenerator:
    enabled: true
    idGenerator:
      appConfig:
        idTypes:
          agent:
            idLength: 8

  # The platform's sanity suite, from its own image: the smoke tier runs on
  # every install/upgrade. Its e2e tier seeds and searches a reference-registry
  # record over DCI, which this registry does not serve, so it stays off.
  sanity:
    enabled: true
    runE2e: false

  # AWE (agent change requests and the intake form): nothing to set. The
  # openg2p-registry chart enables it by default (global.aweEnabled: true),
  # pointed at the shared AWE in commons-services; db-seed then writes this
  # release's callback secret to the shared AWE database. The Agent approval
  # policies (awe_meta_data/) and the demo approvers alex.carter / nina.patel
  # they name are sample data: db-seed loads them only with loadSampleData. In
  # production the policies are set up in AWE's admin portal.

  # No beneficiary portal: the registry's records are the agents themselves,
  # kept by the staff who manage them. Off, as in the platform chart; set here so
  # the overlay says so.
  beneApi:
    enabled: false

  # The Registry Connector (ingestion gateway), off: see global.connectorHostname.
  registryConnector:
    enabled: false

  # ── Verifiable credentials: an agent's ID card, issued at the counter ──────
  #
  # MASTER SWITCH: agentPortalApi.enabled, off by default.
  #   false → nothing: no Agent Portal API or UI, no route, no card ConfigMap,
  #           no credential_config registration. agent_vc_view is still created
  #           by db-seed (a view over existing columns, unread).
  #   true  → the Agent Portal is deployed; vcIssuance.enabled then mounts the
  #           issuance routes.
  #
  # To issue credentials (see the platform's VC Issuance docs), the environment
  # also needs Inji Certify (commons layer) with global.vcIssuer.did set to the
  # same DID, the Keycloak `agent` realm, and an ID system for the agent's
  # authentication (eSignet). With vcIssuance on, the bootstrap Job creates the
  # eSignet client and provider row and sets the Agent register's
  # requires_registrant_authentication (db-seed never resets it).
  agentPortalApi:
    enabled: false
    # The agents-built variant of the platform's agent-portal-api image: the same
    # service plus the agents extension (docker/agent-portal-api/Dockerfile). The
    # platform's image would create the reference registry's tables.
    image:
      repository: openg2p/openg2p-agents-registry-agent-portal-api
      tag: 0.0.0-develop
    vcIssuance:
      enabled: false
      # Credentials are issued from the Agent register.
      registerId: a6e00000-0000-4000-8000-0000000a0001
    # Card designs shipped by this chart (templates/vc-card-templates-configmap.yaml).
    svgConfigMap: '{{ .Release.Name }}-vc-card-templates'
    pdf:
      title: "Agent Credential"
      issuerName: "Ministry of Agriculture"
    # The agent credential: identity and role. See the header of
    # agents-extension/.../meta_data/vc-views/agent_vc_view.sql for why the rest
    # of the record is deliberately not on the card.
    vcDefinitions:
      - config_id: OpenG2PAgentCredential
        credential_types: ["VerifiableCredential", "OpenG2PAgentCredential"]
        view: agent_vc_view
        claim_columns: ["functionalRecordId", "fullName", "dateOfBirth", "gender", "position", "servicePoint",
                        "assignedArea"]
        svg_template: agent-card.svg
        display_name: "Agent Credential"
        # The id the QR carries in claim-169's generic "Data" slot.
        qr_data_label: "Agent ID"
        # Registered with Certify by the subchart's credential-config-register
        # Job; the issuer (DID and signing key) comes from global.vcIssuer.
        certifyConfig:
          credentialConfigKeyId: OpenG2PAgentCredential
          credentialFormat: ldp_vc
          credentialTypes: ["VerifiableCredential", "OpenG2PAgentCredential"]
          contextURLs: ["https://www.w3.org/2018/credentials/v1"]
          scope: openg2p_agent_vc_ldp
          # The compact claim-169 QR (what an offline verifier reads), as the
          # Farmer Registry's: claim-169 attribute names only, the Agent ID in the
          # generic "Data" slot (see the Farmer Registry chart for why not "Data
          # issuer").
          qrSettings:
            - claim169:
                Version: '1.0'
                Language: eng
                Full Name: '${fullName}'
                Date of Birth: '${dateOfBirth}'
                Gender: '${gender}'
                Data: '${functionalRecordId}'
          qrSignatureAlgo: ES256
          displayOrder: ["functionalRecordId", "fullName", "position", "servicePoint", "assignedArea",
                         "dateOfBirth", "gender"]
          metaDataDisplay:
            - name: "OpenG2P Agent Credential"
              locale: en
          credentialSubjectDefinition:
            functionalRecordId: { display: [{ name: "Agent ID", locale: en }] }
            fullName: { display: [{ name: "Full Name", locale: en }] }
            dateOfBirth: { display: [{ name: "Date of Birth", locale: en }] }
            gender: { display: [{ name: "Gender", locale: en }] }
            position: { display: [{ name: "Position", locale: en }] }
            servicePoint: { display: [{ name: "Service Point", locale: en }] }
            assignedArea: { display: [{ name: "Assigned Area", locale: en }] }
          # Readable JSON, base64-encoded for Certify by the register Job.
          # ${_issuer} / ${_holderId} / ${validFrom} / ${validUntil} are filled by
          # Certify; the rest are the pushed claims.
          vcTemplateJson: |
            {
              "@context": [
                "https://www.w3.org/2018/credentials/v1",
                {
                  "OpenG2PAgentCredential": "https://openg2p.org/ns#OpenG2PAgentCredential",
                  "functionalRecordId": "https://schema.org/identifier",
                  "fullName": "https://schema.org/name",
                  "dateOfBirth": "https://schema.org/birthDate",
                  "gender": "https://schema.org/gender",
                  "position": "https://schema.org/jobTitle",
                  "servicePoint": "https://schema.org/workLocation",
                  "assignedArea": "https://schema.org/areaServed"
                },
                "https://w3id.org/security/suites/ed25519-2020/v1"
              ],
              "issuer": "${_issuer}",
              "type": ["VerifiableCredential", "OpenG2PAgentCredential"],
              "issuanceDate": "${validFrom}",
              "expirationDate": "${validUntil}",
              "credentialSubject": {
                "id": "${_holderId}",
                "functionalRecordId": "${functionalRecordId}",
                "fullName": "${fullName}",
                "dateOfBirth": "${dateOfBirth}",
                "gender": "${gender}",
                "position": "${position}",
                "servicePoint": "${servicePoint}",
                "assignedArea": "${assignedArea}",
                "claim169": { "qrCode": "${claim_169_values.get(0)}" }
              }
            }
